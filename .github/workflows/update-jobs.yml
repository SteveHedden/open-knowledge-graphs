name: Recover retained jobs for direct classification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            jobs/runtime/sources
            jobs/runtime/raw/first-party-*.json
          key: kg-jobs-private-last-good-main-35199233267
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: build/tag-response-cache.json
          key: shared-tags-main-35199233267
          fail-on-cache-miss: true
      - uses: actions/upload-artifact@v4
        with:
          name: retained-jobs-for-classification
          path: |
            jobs/runtime/sources
            build/tag-response-cache.json
          retention-days: 7
