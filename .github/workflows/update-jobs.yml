name: Update KG Jobs Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Production source identifier from sources.ttl; default refreshes all in bounded batches
        required: false
        default: all
        type: string
      force_refresh:
        description: Bypass cadence for one explicitly selected production source
        required: false
        default: false
        type: boolean
      dry_run:
        description: Dry run -- refresh and log, but skip storing a validated dataset snapshot
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dataset-refresh-jobs
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Record run start
        id: run_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            jobs/requirements.txt
            requirements.txt

      - name: Install KG Jobs dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install root catalog_snapshot.py dependencies
        run: pip install -r ../requirements.txt

      - name: Pin and restore last-good independent refresh outputs
        run: |
          python ../scripts/dataset_snapshots.py pin --directory "$RUNNER_TEMP/refresh-inputs"
          python ../scripts/dataset_snapshots.py hydrate --root .. --directory "$RUNNER_TEMP/refresh-inputs"

      - name: Restore last committed snapshot into runtime/
        run: |
          mkdir -p runtime/raw runtime/sources
          [ -f ../data/jobs/jobs.json ] && cp ../data/jobs/jobs.json runtime/jobs.json
          [ -f ../data/jobs/jobs.ttl ] && cp ../data/jobs/jobs.ttl runtime/jobs.ttl
          [ -f ../data/jobs/run.json ] && cp ../data/jobs/run.json runtime/run.json
          [ -f ../data/jobs/identity-history.json ] && cp ../data/jobs/identity-history.json runtime/identity-history.json
          if [ -d ../data/jobs/raw ]; then
            shopt -s nullglob
            for f in ../data/jobs/raw/*.json; do cp "$f" runtime/raw/; done
          fi
          exit 0

      - name: Restore private last-good first-party evidence
        id: restore_private_state
        uses: actions/cache/restore@v4
        with:
          path: |
            jobs/runtime/sources
            jobs/runtime/raw/first-party-*.json
          key: kg-jobs-private-last-good-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kg-jobs-private-last-good-${{ github.ref_name }}-

      - name: Build one bounded-parallel production snapshot
        id: refresh
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh && 'true' || 'false' }}
        run: |
          args=(
            scripts/task42_nightly.py
            --live
            --runtime-dir runtime
            --source "${{ github.event_name == 'workflow_dispatch' && inputs.source || 'all' }}"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force-refresh)
          fi
          python "${args[@]}"

      - name: Retain first-party diagnostics outside the public Pages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-party-diagnostics-${{ github.run_id }}
          path: |
            jobs/runtime/raw/first-party-*.json
            jobs/runtime/sources/first-party-*.json
            jobs/runtime/careers-discovery/run.json
            jobs/runtime/nightly-run.json
            jobs/runtime/jobs.json
            jobs/runtime/jobs.ttl
            jobs/runtime/run.json
            jobs/runtime/raw/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Save private last-good first-party evidence
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            jobs/runtime/sources
            jobs/runtime/raw/first-party-*.json
          key: kg-jobs-private-last-good-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish snapshot to the committed data path
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: >-
          python scripts/promote_jobs_snapshot.py
          --runtime runtime
          --destination ../data/jobs

      - name: Reuse supported job assignments and queue pending review
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: python ../scripts/shared_tags.py --root .. --only jobs

      - name: Seal validated jobs snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: python ../scripts/dataset_snapshots.py bundle --root .. --dataset jobs --directory "$RUNNER_TEMP/jobs-snapshot"

      - name: Store immutable jobs output independently of publication
        id: commit
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: python ../scripts/dataset_snapshots.py store --dataset jobs --directory "$RUNNER_TEMP/jobs-snapshot"

      - name: Report run outcome
        if: always()
        run: |
          {
            echo "## KG jobs live refresh"
            echo
            echo "- dryRun: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}"
            echo "- forceRefresh: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh == true }}"
            echo "- snapshotChanged: ${{ steps.commit.outputs.changed || 'skipped (dry run)' }}"
            echo "- sourcesWithHardFailures: ${{ steps.refresh.outputs.failures || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if any source hard-failed
        if: always()
        run: |
          if [ "${{ steps.refresh.outputs.failures }}" != "0" ]; then
            echo "One or more sources failed to refresh (not a refresh-interval skip); see logs above." >&2
            exit 1
          fi
