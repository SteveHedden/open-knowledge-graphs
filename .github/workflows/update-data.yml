name: Diagnose Workers AI embedding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe embedding and inspect Worker bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID']
          def call(path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base+path, data=body, headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e: return e.code, json.load(e)
          status, response = call('/ai/run/@cf/baai/bge-base-en-v1.5', {'text':['knowledge graph']})
          print('Embedding probe:', json.dumps({'httpStatus':status,'success':response.get('success'),'errors':response.get('errors'), 'resultKeys':list((response.get('result') or {}).keys()),'dimensions':[len(x) for x in (response.get('result') or {}).get('data',[])]}))
          status, response = call('/workers/scripts/okg-api/settings')
          result = response.get('result') or {}
          print('Worker settings:', json.dumps({'httpStatus':status,'errors':response.get('errors'),'compatibility_date':result.get('compatibility_date'),'bindings':[{'name':b.get('name'),'type':b.get('type')} for b in result.get('bindings',[])]}))
          PY
