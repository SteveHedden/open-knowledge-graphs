name: Refresh Software Data

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-refresh-software
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current code and last-good data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare isolated dataset staging
        run: python scripts/catalog_snapshot.py prepare --repository . --destination "$RUNNER_TEMP/dataset-staging"
      - name: Pin and restore last-good independent refresh outputs
        run: |
          python scripts/dataset_snapshots.py pin --directory "$RUNNER_TEMP/refresh-inputs"
          python scripts/dataset_snapshots.py hydrate --root "$RUNNER_TEMP/dataset-staging" --directory "$RUNNER_TEMP/refresh-inputs"

      - name: Refresh software only with bounded source retries
        env:
          OKG_CATALOG_ROOT: ${{ runner.temp }}/dataset-staging
        run: python scripts/fetch_data.py --dataset software
      - name: Reuse supported assignments and queue pending software review
        run: python scripts/shared_tags.py --root "$RUNNER_TEMP/dataset-staging" --only software
      - name: Seal validated dataset output
        run: python scripts/dataset_snapshots.py bundle --root "$RUNNER_TEMP/dataset-staging" --dataset software --directory "$RUNNER_TEMP/dataset-snapshot"
      - name: Store immutable snapshot without changing main
        run: python scripts/dataset_snapshots.py store --dataset software --directory "$RUNNER_TEMP/dataset-snapshot"
      - name: Report refresh failure and retained data
        if: failure()
        run: echo "software refresh failed; previous validated snapshot retained. Unrelated publication remains available." >> "$GITHUB_STEP_SUMMARY"
