name: Classification Review Inbox
on:
  workflow_run:
    workflows: ["Publish Catalog Generation"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: classification-review-inbox
  cancel-in-progress: false
  queue: max
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update the reusable classification issue from committed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/classification_issue.py --sync
